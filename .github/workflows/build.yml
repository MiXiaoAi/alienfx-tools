name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2025 # Windows Server 2025 + Visual Studio 2026 (v145 toolset + WDK VS extension)
    timeout-minutes: 30
    permissions:
      contents: write # needed for gh release on tag pushes
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # alienfan-SDK / alienfan-low use WDK + Windows SDK NuGet packages (packages.config),
      # imported from <repo-root>\packages. Restore them explicitly before building.
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore alienfan-tools/alienfan-SDK/packages.config -PackagesDirectory packages
          nuget restore alienfan-tools/alienfan-SDK/alienfan-low/packages.config -PackagesDirectory packages

      # The vcxproj files pin VCToolsVersion to the author's local MSVC build (14.50.35717).
      # Detect the toolset actually installed on the runner and override the pin with it.
      - name: Detect installed MSVC toolset
        id: msvc
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio with C++ build tools not found' }
          $msvc = Get-ChildItem (Join-Path $vsPath 'VC\Tools\MSVC') -Directory |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $msvc) { throw 'MSVC toolset not found' }
          Write-Host "Using MSVC toolset $($msvc.Name)"
          "version=$($msvc.Name)" >> $env:GITHUB_OUTPUT

      # MSB4078 = Install.vdproj (VS Installer project) is skipped by MSBuild; harmless.
      # Extend the matrix below (e.g. "Release x86"/Win32) if more configurations are needed.
      - name: Build solution
        shell: pwsh
        run: |
          msbuild alien-tools.sln -m `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:VCToolsVersion=${{ steps.msvc.outputs.version }} `
            -warnasmessage:MSB4078

      - name: Collect binaries
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $bins = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File -Include *.exe,*.dll |
            Where-Object {
              $_.FullName -notmatch '\\packages\\' -and
              $_.FullName -match '\\Release\\'
            }
          if (-not $bins) { throw 'No build outputs found under a Release output directory' }
          $bins | ForEach-Object { Copy-Item $_.FullName -Destination $dist }

          Copy-Item README.md, LICENSE, alien-config.cmd -Destination $dist
          Copy-Item Doc -Recurse -Destination (Join-Path $dist 'Doc')

          Get-ChildItem -Recurse $dist | ForEach-Object { $_.FullName.Replace($dist, 'dist') }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: alienfx-tools-win64
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = "alienfx-tools-$tag-win64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
